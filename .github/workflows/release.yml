name: 发布 Windows、macOS 与 Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x86_64
            bundles: nsis,msi
          - runner: macos-15
            platform: darwin-aarch64
            bundles: app,dmg
          - runner: macos-15-intel
            platform: darwin-x86_64
            bundles: app,dmg
          - runner: ubuntu-22.04
            platform: linux-x86_64
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: tmp/plc-pilot-runtime-cache
          key: runtime-${{ matrix.platform }}-${{ hashFiles('scripts/prepare-runtime.mjs', 'scripts/prepare-documents.mjs', 'scripts/patent-runtime-requirements.txt') }}
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libfuse2 xdg-utils
      - name: 核对发布版本
        run: node -e 'const v=require("./package.json").version;const r=process.env.GITHUB_REF;if(r!=="refs/heads/main"&&r!=="refs/tags/v"+v)throw Error("Release requires main or its matching version tag")'
      - run: npm ci
      - name: 构建资源与验证工具链
        run: |
          set -euo pipefail
          npm run build
          node --test shared/diagnostics.test.mjs stone-mcp/test/stone.test.mjs agent-host/*.test.mjs src/utils/conversationTurns.test.mjs
          cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: 构建签名安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: '-'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npx tauri build --bundles '${{ matrix.bundles }}' --config '{"build":{"beforeBuildCommand":""}}'
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm run package:portable
            npm run package:stone-mcp
          fi
          node scripts/prepare-release.mjs
      - name: 校验打包后的内置运行时
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node scripts/check-packaged-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-stage/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/download-artifact@v4
        with:
          path: release-stage
          merge-multiple: true
      - name: 核验各平台安装包、签名与更新清单
        run: node scripts/merge-release.mjs release-stage
      - name: 上传完整附件后公开发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/plc-release.json" 2>/dev/null; then
            node -e 'if(!require(process.env.RUNNER_TEMP+"/plc-release.json").isDraft)throw Error("Release is already public; increment the version")'
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "PLC Pilot $tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" release-stage/*.exe release-stage/*.msi release-stage/*.zip release-stage/*.sig release-stage/*.dmg release-stage/*.tar.gz release-stage/*.AppImage release-stage/*.deb release-stage/latest.json release-stage/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false --latest
