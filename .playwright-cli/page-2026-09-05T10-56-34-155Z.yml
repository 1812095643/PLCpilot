                    - paragraph [ref=e285]: 验证A
                    - paragraph [ref=e286]: PLC代码审查首先确认审查边界和运行背景，包括控制器型号、CODESYS版本、任务配置、扫描周期、现场设备、通信关系及安全等级。审查人员应明确本次对象是新增功能、故障修复还是整机变更，并取得对应的程序版本、需求说明、I/O表和测试记录。未确认工程版本、目标设备或代码来源时，不应直接提出写入、下载或上线结论，避免基于错误基线开展审查。
                    - paragraph [ref=e287]: 第二步检查工程结构和责任边界。逐项定位PROGRAM、FUNCTION_BLOCK、FUNCTION、GVL、DUT、接口、库管理器和任务配置，梳理调用关系与数据流。重点确认每个物理输出和关键状态只有一个最终写入者，避免多个POU在同一扫描周期内竞争赋值。还要检查全局变量是否被过度使用，以及输入采集、逻辑判断、状态处理和输出执行是否保持清晰分层。
                    - paragraph [ref=e288]: 第三步按照PLC循环扫描模型审查程序语义。需要分析变量在连续扫描周期中的保持、覆盖和更新顺序，不能把Structured Text当作只执行一次的脚本。对于R_TRIG、F_TRIG、TON、TOF、TP及计数器，应确认实例具有持久生命周期，调用条件完整，时间单位正确。还应结合任务周期检查定时精度、抖动、漏脉冲和单周期信号是否可能影响控制结果。
                    - paragraph [ref=e289]: 第四步审查启动、停止、急停、故障和复位逻辑。启动条件应包含必要的设备就绪、模式许可和安全互锁；停止请求应具有确定的优先级；急停或安全链断开时，危险输出必须进入失效安全状态。故障复位不能直接重新启动设备，应先确认故障条件已经消失，并要求独立的复位动作。通信中断、传感器断线和数值越界也必须有明确处理路径。
                    - paragraph [ref=e290]: 第五步重点检查状态机。状态机应具有明确的初始态、正常运行态、停止态和故障态，并为每个转换定义唯一、可追踪的条件。执行机构动作应设置合理超时，超时后进入安全故障处理，而不是无限等待。对于异常状态值，应提供默认分支并回退至安全状态。状态进入动作、持续动作和退出动作应区分清楚，避免同一指令在每个扫描周期被重复触发。
                    - paragraph [ref=e291]: 第六步审查数据类型、边界和通信数据。检查整数溢出、符号转换、浮点比较、除零、数组下标、字符串长度及单位换算，避免隐式类型转换掩盖错误。模拟量应验证量程、工程单位和异常值范围，通信数据应检查新鲜度、有效位、心跳和超时。来自HMI或上位机的设定值不能直接驱动危险动作，必须经过范围限制、权限判断、模式确认和本地互锁。
                    - paragraph [ref=e292]: 第七步进行变更差异和可测试性审查。将修改内容与已知基线比较，确认没有无关格式化、对象删除、变量重命名或I/O映射变化。测试应覆盖正常流程、边界值、互锁冲突、急停、断电恢复、通信丢失、传感器故障、执行器不到位和重复复位等场景。关键逻辑应记录输入条件、预期状态转换、输出结果和报警行为，使测试可以复现，而不是只依赖现场观察。
                    - paragraph [ref=e293]: 第八步完成编译、诊断和发布判定。代码写入前应先生成可审阅的差异，获得批准后再应用修改，并使用目标版本的CODESYS编译器执行完整编译。所有错误必须清零，警告应逐条判断是否可接受；通用语法检查不能替代目标工程编译。审查结论应列明证据、遗留风险和回退方案。下载、RUN、STOP、Reset、Force及在线写变量必须单独审批，未经验证不得宣称修改已经上线。
