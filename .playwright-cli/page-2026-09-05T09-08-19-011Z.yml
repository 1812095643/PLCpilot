                - article [ref=e209]:
                  - generic [ref=e210]:
                    - heading "一、程序结构与责任边界" [level=3] [ref=e211]
                    - paragraph [ref=e212]: 审查前先确认任务周期、程序调用顺序以及 POU、功能块、全局变量表之间的关系。每个物理输出应只有一个最终写入者，避免多个程序重复赋值造成结果依赖执行顺序。状态、命令、反馈和输出应分层表达，变量命名、数据类型与注释应符合工程既有规范。
                    - heading "二、扫描周期与时序逻辑" [level=3] [ref=e213]
                    - paragraph [ref=e214]: PLC 逻辑必须按循环扫描模型分析。检查瞬时信号能否被可靠捕获，边沿检测实例是否持久化，定时器和计数器是否会被重复初始化。确认 TON、TOF、TP 的时间单位、预置值和复位条件，并结合任务周期评估响应延迟。不得把跨周期动作误写成一次性顺序脚本。
                    - heading "三、状态机与流程控制" [level=3] [ref=e215]
                    - paragraph [ref=e216]: 状态机应具有明确的初始态、运行态、停止态、故障态和必要的恢复态。每个转换条件应互斥、可追踪，并设置合理超时；未知状态必须回退到安全状态。检查启动、暂停、停止、故障和复位是否分别处理，避免使用一个布尔量承担多个语义。复位不应直接绕过安全条件。
                    - heading "四、安全互锁与失效处理" [level=3] [ref=e217]
                    - paragraph [ref=e218]: 重点检查急停、防护门、限位、过载、压力及通信状态等互锁。危险输出应采用失效安全逻辑，传感器断线、数据越界、通信超时或模块故障时不得保持危险动作。自动与手动模式都必须受核心安全条件约束，手动点动和维护旁路还应具备权限、超时及明确指示。
                    - heading "五、数据质量与异常边界" [level=3] [ref=e219]
                    - paragraph [ref=e220]: 审查数组下标、字符串长度、类型转换、除零、溢出和量程换算。模拟量应验证有效范围、质量位及滤波策略，不能将异常值直接用于控制。报警应明确触发、锁存、确认和恢复条件，避免瞬时故障被漏报。通信数据需要新鲜度判断，并为丢包或设备离线提供确定的降级行为。
                    - heading "六、验证、诊断与变更控制" [level=3] [ref=e221]
                    - paragraph [ref=e222]: 代码修改前应读取现有实现和库依赖，通过差异预览确认影响范围。验证时覆盖正常启动、连续运行、停机、故障注入、通信中断、断电重启及边界值场景。必须使用目标版本的 CODESYS 编译器检查错误和警告；通用 ST 语法通过不能替代目标工程编译。下载、启停、复位和变量强制应单独审批并保留记录。
