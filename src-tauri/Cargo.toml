[package]
name = "plc-pilot"
version = "0.1.0"
description = "PLC Pilot 面向 CODESYS 的独立桌面 Agent 工作台"
authors = ["PLC Pilot"]
edition = "2021"

[lib]
name = "plc_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = "4.3"
walkdir = "2.5"
dirs = "6.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
tempfile = "3.20"
tokio = { version = "1.47", features = ["process", "io-util", "time", "rt-multi-thread", "net", "macros"] }
similar = "2.7"
thiserror = "2.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
