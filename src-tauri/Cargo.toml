[package]
name = "plc-pilot"
version = "0.1.5"
description = "PLC Pilot 面向 CODESYS 的独立桌面 Agent 工作台"
authors = ["PLC Pilot"]
edition = "2021"

[lib]
name = "plc_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.1", features = [] }
tauri-plugin-updater = "2.11.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
calamine = "0.36"
pdf-extract = "0.12"
quick-xml = "0.41"
rfd = { version = "0.17", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = "4.3"
walkdir = "2.5"
dirs = "6.0"
dunce = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
codex-apply-patch = { path = "../vendor/codex-patch/apply-patch" }
serde_yaml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
tempfile = "3.20"
tokio = { version = "1.47", features = ["process", "io-util", "time", "rt-multi-thread", "net", "macros"] }
similar = "2.7"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
regex = "1.11"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
